[project]
name = "tsp-evolutionary-algorithm"
version = "0.1.0"
description = "Genetic Algorithm for the Travelling Salesman Problem (TARI29 Group 9)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
